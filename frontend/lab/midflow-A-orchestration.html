<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>中间流程 · 编排调度型 · 攻击应对</title>
<style>
:root{
  --bg:#F6F8FB; --surface:#FFFFFF; --surface-2:#FAFCFE;
  --ink:#1B2733; --ink-2:#516274; --muted:#8296A8;
  --line:#E8EEF5; --line-2:#D9E3ED;
  --brand:#3A7CA5; --brand-ink:#2A6084; --brand-soft:#EBF3FA;
  --agent:#6C63C9; --agent-soft:#F1F0FD;
  --ok:#1F8A63; --ok-soft:#E9F6F0;
  --warn:#B7791F; --warn-soft:#FCF5E7;
  --bad:#C4553F; --bad-soft:#FCEEEA;
  --r:8px; --r-sm:6px;
  --sh-1:0 1px 2px rgba(27,39,51,.04);
  --sh-2:0 1px 2px rgba(27,39,51,.04),0 12px 30px -16px rgba(27,39,51,.18);
  --ease:cubic-bezier(.32,.72,0,1);
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.wrap{max-width:1360px;margin:0 auto;padding:24px 28px 56px}

header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .inner{max-width:1360px;margin:0 auto;padding:15px 28px;display:flex;
  flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{color:var(--brand);flex:none}
h1{font-size:18px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:12.5px;margin:3px 0 0}
.role{display:flex;gap:20px;flex-wrap:wrap}
.role div{font-size:12px;color:var(--muted)}
.role b{display:block;color:var(--ink);font-size:12.5px;font-weight:600;margin-top:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:18px;box-shadow:var(--sh-1);min-width:0}
.panel>h2{margin:0;padding:13px 18px;border-bottom:1px solid var(--line);
  font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px}
.panel>h2 svg{color:var(--brand);flex:none}
.panel>h2 .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.panel .body{padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}

textarea{width:100%;min-height:250px;padding:12px 14px;border:1px solid var(--line-2);
  border-radius:var(--r-sm);font-family:var(--mono);font-size:11.5px;line-height:1.75;
  color:var(--ink-2);background:var(--surface-2);resize:vertical;outline:none;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 13px;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;
  gap:1px;line-height:1.4;box-shadow:var(--sh-1);
  transition:border-color .2s var(--ease),box-shadow .25s var(--ease),transform .2s var(--ease),color .2s var(--ease)}
.chip:hover{border-color:var(--brand);color:var(--brand-ink);transform:translateY(-1px);box-shadow:var(--sh-2)}
.chip small{font-size:10.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.btn{font-size:13px;font-weight:600;padding:10px 20px;border-radius:var(--r-sm);cursor:pointer;
  border:1px solid transparent;background:var(--brand);color:#fff;
  box-shadow:0 10px 22px -12px rgba(58,124,165,.95);
  transition:background .2s var(--ease),transform .2s var(--ease),box-shadow .25s var(--ease),opacity .2s}
.btn:hover:not(:disabled){background:var(--brand-ink);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink-2);box-shadow:var(--sh-1)}
.btn.ghost:hover:not(:disabled){border-color:var(--brand);color:var(--brand-ink);background:var(--surface)}
.note{font-size:11.5px;color:var(--muted);line-height:1.7}

.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.metric{padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.metric .l{font-size:11.5px;color:var(--muted)}
.metric .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.metric.ok .v{color:var(--ok)} .metric.warn .v{color:var(--warn)} .metric.bad .v{color:var(--bad)}

.steps{position:relative}
.steps::before{content:"";position:absolute;left:11px;top:26px;bottom:26px;width:1px;background:var(--line-2)}
.step{position:relative;display:flex;gap:14px;padding:12px 0;animation:stepIn .4s var(--ease) both}
@keyframes stepIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sIdx{width:24px;height:24px;border-radius:50%;flex:none;margin-top:2px;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:700;
  background:var(--brand-soft);color:var(--brand-ink);box-shadow:0 0 0 4px var(--surface);
  font-variant-numeric:tabular-nums;transition:background .3s var(--ease),color .3s var(--ease)}
.sIdx.ok{background:var(--ok-soft);color:var(--ok)}
.sIdx.bad{background:var(--bad-soft);color:var(--bad)}
.sIdx.warn{background:var(--warn-soft);color:var(--warn)}
.sIdx.run{background:var(--agent-soft);color:var(--agent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.sMain{flex:1;min-width:0}
.sTop{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sName{font-size:13.5px;font-weight:600}
.sSvc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sMs{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.sBody{margin-top:5px;padding:9px 11px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);font-family:var(--mono);
  line-height:1.8;white-space:pre-wrap;word-break:break-word}
.sBody.bad{background:var(--bad-soft);border-color:#F3D6CF;color:#8E3A29}
.sBody.warn{background:var(--warn-soft);border-color:#F0E0C4;color:#7A5410}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 10px;
  font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.mute{background:#F1F4F7;color:var(--muted)}
.tag.brand{background:var(--brand-soft);color:var(--brand-ink)}
.empty{color:var(--muted);font-size:12.5px;padding:20px 0;text-align:center}
.verdict{margin-top:16px;padding:15px 18px;border-radius:var(--r);border:1px solid #DCE8F2;
  background:var(--brand-soft)}
.verdict.ok{background:var(--ok-soft);border-color:#CFEADF}
.verdict.warn{background:var(--warn-soft);border-color:#F2E2C6}
.verdict.bad{background:var(--bad-soft);border-color:#F3D6CF}
.vTitle{font-size:14px;font-weight:700}
.vMeta{margin-top:6px;font-size:12.5px;color:var(--ink-2);line-height:1.95}
.vMeta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media (max-width:1000px){
  .wrap{padding:18px 16px 44px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

<header class="top">
  <div class="inner">
    <div>
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M10 6.5h7"/><path d="M13.5 6.5V18"/></svg>
        <h1>中间流程 · 编排调度型</h1>
      </div>
      <p class="sub">接收攻击事件，按编排计划调度后端能力，聚合结果返回前端。决策逻辑不在本层。</p>
    </div>
    <div class="role">
      <div>本层职责<b>编排 · 调度 · 容错</b></div>
      <div>前端<b>事件注入与展示</b></div>
      <div>后端<b>取证 / 处置 / 定损 / 赔付</b></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid2">
    <section class="panel">
      <h2>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        事件注入
        <span class="hint">手动注入一条攻击事件</span>
      </h2>
      <div class="body">
        <div class="chips" id="presets"></div>
        <textarea id="evt" spellcheck="false"></textarea>
        <div class="actions">
          <button class="btn" id="run">注入事件并执行编排</button>
          <button class="btn ghost" id="reset">清空幂等记录</button>
        </div>
        <div class="note" id="idemNote" style="margin-top:10px"></div>
      </div>
    </section>

    <section class="panel">
      <h2>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
        编排链路
        <span class="hint" id="runHint"></span>
      </h2>
      <div class="body">
        <div class="metrics" id="metrics"></div>
        <div class="steps" id="steps"></div>
        <div id="verdict"></div>
      </div>
    </section>
  </div>

  <section class="panel">
    <h2>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      编排计划
      <span class="hint">本层只负责顺序、超时、重试、降级与幂等，不含业务判断</span>
    </h2>
    <div class="body" id="planBody"></div>
  </section>
</div>

<script>
/* ============================================================
   中间流程 · 编排调度型
   职责边界：只做流程编排与容错，不承载业务规则与模型推理。
   每一步都是一次后端服务调用，本层负责顺序、超时、重试、降级、幂等。
   ============================================================ */

const PLAN = [
  { id:'gateway',  name:'事件接入与校验', svc:'event.gateway',     timeout:800,  cost:120 },
  { id:'dedupe',   name:'幂等去重',       svc:'idempotency.store', timeout:300,  cost:60  },
  { id:'evidence', name:'取证与存证固化', svc:'evidence.vault',    timeout:1500, cost:420 },
  { id:'mitigate', name:'应对指令下发',   svc:'mitigation.ops',    timeout:1200, cost:380 },
  { id:'assess',   name:'事件评估',       svc:'incident.assess',   timeout:2000, cost:640 },
  { id:'adjust',   name:'第三方定损',     svc:'loss.adjust',       timeout:2500, cost:880 },
  { id:'pricing',  name:'保单规则引擎',   svc:'policy.engine',     timeout:900,  cost:210 },
  { id:'payout',   name:'赔付执行',       svc:'payout.core',       timeout:1500, cost:460 },
];

const BASE_EVT = {
  eventId: "EVT-2026-1007-0142",
  detectedAt: "2026-10-07 09:14:22",
  detector: "边界流量探针",
  attackType: "DDoS 分布式拒绝服务",
  severity: "high",
  target: { node: "推理集群 A", addr: "0x7A2f…C41d" },
  signals: [
    "入站流量突增至基线 47 倍",
    "SYN 半连接数达阈值 12 倍",
    "同一源地址段持续 6 分钟"
  ],
  affected: ["推理 API", "训练任务调度"],
  evidence: ["netflow-20261007-0914.json", "edr-alert-88213", "waf-log-slice-4471"],
  downtimeHours: 26,
  perHourLoss: 120000,
  coverageLimit: 5000000,
  fault: null
};

const PRESETS = [
  { key:'normal',  chip:'正常事件',       sub:'全链路健康',
    patch:{} },
  { key:'dup',     chip:'重复事件',       sub:'同 eventId 再注入',
    patch:{} },
  { key:'retry',   chip:'取证服务超时',   sub:'触发重试',
    patch:{ eventId:"EVT-2026-1007-0143", fault:"evidence.timeout" } },
  { key:'degrade', chip:'处置服务不可用', sub:'触发降级',
    patch:{ eventId:"EVT-2026-1007-0144", fault:"mitigate.down" } },
];

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const money = (n) => '¥' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

const state = { selected:'normal', processed:new Set(), running:false, lastEvent:null };

/* ---------- 编排计划展示 ---------- */
function renderPlan(){
  $('planBody').innerHTML = '<table style="width:100%;border-collapse:collapse">' +
    '<thead><tr>' +
    '<th style="text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--line)">步骤</th>' +
    '<th style="text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--line)">后端服务</th>' +
    '<th style="text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--line)">超时</th>' +
    '<th style="text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:0 0 8px 0;border-bottom:1px solid var(--line)">失败处理</th>' +
    '</tr></thead><tbody>' +
    PLAN.map((s, i) => {
      const fail = s.id === 'dedupe' ? '命中即中止编排'
        : s.id === 'evidence' ? '重试 1 次，仍失败则中止'
        : s.id === 'mitigate' ? '降级：转人工确认通道后继续'
        : s.id === 'payout' ? '重试 2 次，仍失败则挂起并告警'
        : '重试 1 次后中止';
      return '<tr>' +
        '<td style="padding:9px 12px 9px 0;border-bottom:1px solid var(--line);font-size:12.5px">' +
          '<span class="mono" style="color:var(--muted)">' + String(i + 1).padStart(2,'0') + '</span>　' + s.name + '</td>' +
        '<td style="padding:9px 12px 9px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink-2)">' + s.svc + '</td>' +
        '<td style="padding:9px 12px 9px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--muted)">' + s.timeout + ' ms</td>' +
        '<td style="padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)">' + fail + '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
}
/* ---------- 后端能力（本层只调用，不实现） ---------- */
function hashLike(){ return '0x' + Array.from({length:12},()=> '0123456789abcdef'[Math.floor(Math.random()*16)]).join('') + '…'; }

const EXEC = {
  gateway: (evt) => {
    const need = ['eventId','detectedAt','attackType','target','signals'];
    const missing = need.filter(k => !(k in evt));
    if (missing.length) return { status:'bad', stop:true,
      summary:'字段缺失：' + missing.join('、') + '\n事件不予受理，编排未启动' };
    return { status:'ok',
      summary:'字段完整，事件已受理\n事件编号 ' + evt.eventId + '　检测源 ' + evt.detector +
              '\n攻击类型 ' + evt.attackType + '　等级 ' + evt.severity };
  },
  dedupe: (evt, m) => {
    if (state.processed.has(evt.eventId)){
      m.dedup = 1;
      return { status:'bad', stop:true,
        summary:'幂等键 ' + evt.eventId + ' 已存在于幂等表\n判定为重复投递，编排立即中止，未向后端发起任何业务调用' };
    }
    state.processed.add(evt.eventId);
    return { status:'ok', summary:'幂等键写入成功，本次为该事件首次处理' };
  },
  evidence: (evt, m) => {
    const n = (evt.evidence || []).length;
    if (evt.fault === 'evidence.timeout'){
      m.retry = 1;
      return { status:'warn',
        summary:'第 1 次调用超时（超过 1500 ms），已计入重试\n第 2 次调用成功\n' +
                '已固化 ' + n + ' 份证据并写入存证台账，哈希 ' + hashLike() };
    }
    return { status:'ok', summary:'已固化 ' + n + ' 份证据并写入存证台账，哈希 ' + hashLike() + '\n原始日志保留 180 天' };
  },
  mitigate: (evt, m) => {
    if (evt.fault === 'mitigate.down'){
      m.degrade = 1;
      return { status:'warn',
        summary:'mitigation.ops 连续 3 次不可达\n按编排策略降级：转人工确认通道，流程继续\n' +
                '已下发观察态指令：限流阈值下调 30%' };
    }
    return { status:'ok',
      summary:'已下发处置指令\n· 异常源地址段加入黑名单（42 条）\n· 推理 API 切至清洗链路\n· 备用节点已就绪，容量 +60%' };
  },
  assess: (evt) => ({ status:'ok',
    summary:'攻击类型 ' + evt.attackType + '\n影响服务 ' + (evt.affected || []).join('、') +
            '\n是否在保险期间内：是　SLA 是否突破：是' }),
  adjust: (evt, m) => {
    const loss = (evt.downtimeHours || 0) * (evt.perHourLoss || 0);
    m.loss = loss;
    return { status:'ok',
      summary:'第三方定损机构独立核定\n停机 ' + evt.downtimeHours + ' 小时 × ' +
              money(evt.perHourLoss) + '/小时 = ' + money(loss) };
  },
  pricing: (evt, m) => {
    const after = Math.max(0, (m.loss || 0) - 200000);
    const payout = Math.min(after * 0.9, evt.coverageLimit || 0);
    m.payout = payout;
    return { status:'ok',
      summary:'核定损失 ' + money(m.loss || 0) + '　免赔额 ' + money(200000) + '　赔付比例 90%\n' +
              '事件限额 ' + money(evt.coverageLimit || 0) + '　核定赔付 ' + money(payout) };
  },
  payout: (evt, m) => ({ status:'ok',
    summary:'打款完成 ' + money(m.payout || 0) + '\n回执编号 ' + hashLike() +
            '\n风险池已核销，追偿任务已挂起待结案后触发' }),
};

/* ---------- 渲染 ---------- */
function renderPresets(){
  $('presets').innerHTML = PRESETS.map(p =>
    '<button class="chip" data-preset="' + p.key + '" aria-pressed="' + (p.key === state.selected) + '">' +
    p.chip + '<small>' + p.sub + '</small></button>').join('');
}

function loadPreset(key){
  state.selected = key;
  const p = PRESETS.find(x => x.key === key);
  const evt = Object.assign({}, BASE_EVT, p.patch);
  $('evt').value = JSON.stringify(evt, null, 2);
  renderPresets();
  updateIdemNote();
}

function updateIdemNote(){
  const n = state.processed.size;
  $('idemNote').textContent = n
    ? '幂等表已记录 ' + n + ' 个事件：' + Array.from(state.processed).join('、') +
      '　（再次注入同一事件编号会被拦截）'
    : '幂等表为空。先注入「正常事件」，再注入「重复事件」，可以看到幂等拦截。';
}

function renderMetrics(m){
  const items = [
    { l:'编排总耗时', v: m.total ? m.total + ' ms' : '—', c:'' },
    { l:'已完成步骤', v: m.done + ' / ' + PLAN.length, c: m.stopped ? 'warn' : 'ok' },
    { l:'重试次数', v: m.retry, c: m.retry ? 'warn' : '' },
    { l:'降级次数', v: m.degrade, c: m.degrade ? 'warn' : '' },
    { l:'幂等拦截', v: m.dedup, c: m.dedup ? 'bad' : '' },
  ];
  $('metrics').innerHTML = items.map(i =>
    '<div class="metric ' + i.c + '"><div class="l">' + i.l + '</div><div class="v">' + i.v + '</div></div>').join('');
}

let rows = [];
function renderSteps(){
  if (!rows.length){ $('steps').innerHTML = '<div class="empty">尚未注入事件</div>'; return; }
  $('steps').innerHTML = rows.map((r, i) => {
    const cls = r.status === 'ok' ? 'ok' : r.status === 'bad' ? 'bad'
      : r.status === 'warn' ? 'warn' : 'run';
    const tag = r.status === 'ok' ? '<span class="tag ok">调用成功</span>'
      : r.status === 'bad' ? '<span class="tag bad">拦截 / 失败</span>'
      : r.status === 'warn' ? '<span class="tag warn">重试 / 降级</span>'
      : '<span class="tag brand">调用中</span>';
    return '<div class="step">' +
      '<div class="sIdx ' + cls + '">' + String(i + 1).padStart(2,'0') + '</div>' +
      '<div class="sMain">' +
        '<div class="sTop"><span class="sName">' + r.name + '</span>' +
          '<span class="sSvc">' + r.svc + '</span>' + tag +
          '<span class="sMs">' + (r.ms ? r.ms + ' ms' : '') + '</span></div>' +
        (r.body ? '<div class="sBody ' + (r.status === 'bad' ? 'bad' : r.status === 'warn' ? 'warn' : '') + '">' +
          r.body + '</div>' : '') +
      '</div></div>';
  }).join('');
}

function renderVerdict(v){
  if (!v){ $('verdict').innerHTML = ''; return; }
  $('verdict').innerHTML = '<div class="verdict ' + v.kind + '">' +
    '<div class="vTitle">' + v.title + '</div>' +
    '<div class="vMeta">' + v.meta + '</div></div>';
}

/* ---------- 编排执行 ---------- */
async function run(){
  if (state.running) return;
  let evt;
  try { evt = JSON.parse($('evt').value); }
  catch (e){
    renderVerdict({ kind:'bad', title:'事件解析失败', meta:'JSON 格式错误：' + e.message });
    return;
  }
  state.running = true;
  $('run').disabled = true;
  $('runHint').textContent = '执行中';
  rows = [];
  const m = { total:0, done:0, retry:0, degrade:0, dedup:0, stopped:false };
  renderSteps(); renderMetrics(m); renderVerdict(null);

  for (let i = 0; i < PLAN.length; i++){
    const step = PLAN[i];
    rows.push({ name: step.name, svc: step.svc, status:'run', ms:null, body:'调用中…' });
    renderSteps();
    await sleep(260);
    const r = EXEC[step.id](evt, m);
    const cost = step.cost + Math.round(Math.random() * 130);
    await sleep(Math.min(cost, 420));
    m.total += cost;
    rows[i] = { name: step.name, svc: step.svc, status:r.status, ms:cost, body:r.summary };
    renderSteps();
    if (!r.stop) m.done = i + 1;
    renderMetrics(m);
    if (r.stop){ m.stopped = true; break; }
  }

  const used = m.total;
  if (m.dedup){
    renderVerdict({ kind:'warn', title:'重复事件，已忽略',
      meta:'幂等键 <b>' + evt.eventId + '</b> 已存在，编排在第 2 步中止。<br>' +
           '本层未向取证、处置、定损、赔付等任何后端服务发起业务调用，未产生任何副作用。<br>' +
           '累计耗时 <b>' + used + ' ms</b>' });
  } else if (m.stopped){
    renderVerdict({ kind:'bad', title:'编排中止',
      meta:'事件未通过接入校验，未进入后续链路。累计耗时 <b>' + used + ' ms</b>' });
  } else if (m.degrade){
    renderVerdict({ kind:'warn', title:'链路完成，处置指令走了降级通道',
      meta:'处置服务不可达，已按编排策略降级为人工确认，后续步骤照常完成。<br>' +
           '核定赔付 <b>' + money(m.payout || 0) + '</b>　累计耗时 <b>' + used + ' ms</b>　' +
           '重试 <b>' + m.retry + '</b> 次　降级 <b>' + m.degrade + '</b> 次' });
  } else {
    renderVerdict({ kind:'ok', title:'全链路完成，应对已执行',
      meta:'处置指令 <b>已下发</b>　证据 <b>已固化</b>　核定赔付 <b>' + money(m.payout || 0) + '</b><br>' +
           '累计耗时 <b>' + used + ' ms</b>　重试 <b>' + m.retry + '</b> 次　降级 <b>' + m.degrade + '</b> 次' });
  }
  $('runHint').textContent = m.dedup ? '已拦截重复事件' : (m.stopped ? '已中止' : '完成');
  state.running = false;
  $('run').disabled = false;
  updateIdemNote();
}

/* ---------- 绑定 ---------- */
document.addEventListener('click', (e) => {
  const chip = e.target.closest && e.target.closest('[data-preset]');
  if (chip) loadPreset(chip.getAttribute('data-preset'));
});
$('run').addEventListener('click', run);
$('reset').addEventListener('click', () => {
  state.processed.clear();
  rows = []; renderSteps();
  renderMetrics({ total:0, done:0, retry:0, degrade:0, dedup:0, stopped:false });
  renderVerdict(null);
  $('runHint').textContent = '';
  updateIdemNote();
});

renderPlan();
renderPresets();
loadPreset('normal');
renderSteps();
renderMetrics({ total:0, done:0, retry:0, degrade:0, dedup:0, stopped:false });
</script>
